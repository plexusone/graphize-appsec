site_name: graphize-appsec
site_description: Security reachability analysis using code knowledge graphs
site_url: https://plexusone.github.io/graphize-appsec
repo_url: https://github.com/plexusone/graphize-appsec
repo_name: plexusone/graphize-appsec

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli/reference.md
  - Reference:
    - Reachability Tests: reference/reachability-tests.md
    - VEX Output: reference/vex-output.md
  - Guides:
    - SBOM Governance: guides/sbom-governance.md
  - Architecture:
    - Parser Landscape: architecture/parser-landscape.md
  - Examples:
    - Grafana: examples/grafana.md
  - Releases:
    - v0.3.0: releases/v0.3.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/graphize-appsec

plugins:
  - search
